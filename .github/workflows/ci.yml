# Checks every pull request and every push to main. On main, the Docker image is also pushed to
# GHCR (ghcr.io/<owner>/<repo>), where the server pulls it from (PLAN §11.5, §11.7.1).
# Third-party actions and images are pinned to exact versions (PLAN §18.2).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same PostgreSQL image as production (deploy/compose.prod.yml).
  POSTGRES_IMAGE: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  image:
    name: Build, test and push image
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: gliagora:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start the image against an empty PostgreSQL: migrations must apply at startup,
      # /health/ must report the database as reachable and the pages must render.
      - name: Smoke test
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name db --network smoke -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=gliagora -e POSTGRES_PASSWORD=smoke-test-only -e POSTGRES_DB=gliagora \
            "$POSTGRES_IMAGE"
          for i in $(seq 1 30); do docker exec db pg_isready -U gliagora -d gliagora && break; sleep 2; done
          docker run -d --name app --network smoke -p 3000:3000 \
            -e DATABASE_URL=postgres://gliagora:smoke-test-only@db:5432/gliagora \
            -e PAYLOAD_SECRET="$(openssl rand -hex 32)" \
            -e ALTCHA_HMAC_KEY="$(openssl rand -hex 32)" \
            gliagora:ci
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/health/ && break; sleep 2; done
          echo
          # Read the whole response before searching it: `curl | grep -q` fails under pipefail when
          # grep stops at the first match while curl is still writing a longer page (curl exit 23).
          contains() { local body; body="$(curl -fsS "$1")"; grep -qF -- "$2" <<<"$body"; }
          contains http://localhost:3000/health/ '"ok"'
          contains http://localhost:3000/en/ 'Where neuroscience meets'
          contains http://localhost:3000/en/contact/ 'hello@gliagora.com'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = 308
          test "$(docker exec app id -u)" != 0
          docker exec db psql -U gliagora -d gliagora -tAc 'select name from payload_migrations'
          echo "Smoke test passed"

      # PLAN §17.2: axe, keyboard paths and HTTP behaviour against the image that was just built.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Institutions for the institution pages: 21 records from a ROR release (CC0), imported with
      # the same code as the nightly import. The taxonomy and countries come with the migrations.
      # Then fake jobs at those institutions, including the fixed ones the jobs tests rely on
      # (src/scripts/fake-jobs-fixed.ts), and the editor account the admin API tests sign in with
      # (src/scripts/e2e-editor.ts; an example.org address, in this throwaway database only).
      - name: Load test data
        run: |
          pnpm ror:import tests/fixtures/ror/v2.13-2026-09-22-ror-data-sample.zip
          pnpm fake:jobs
          pnpm e2e:editor
        env:
          DATABASE_URL: postgres://gliagora:smoke-test-only@localhost:5432/gliagora
          PAYLOAD_SECRET: test-data-only
          E2E_EDITOR_PASSWORD: e2e-test-only
      # Tests against a real PostgreSQL (pnpm test:db), on scratch databases dropped afterwards:
      # search (src/lib/search/search.db.test.ts, owned by a throwaway role that is not a superuser,
      # as on the server) and the scheduled tasks (tests/integration/, M4.7, on a migrated scratch
      # database, with a throwaway Mailpit container for the emails).
      - name: Database tests
        run: pnpm test:db
        env:
          TEST_DATABASE_URL: postgres://gliagora:smoke-test-only@localhost:5432/gliagora
          PAYLOAD_SECRET: test-data-only
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests (Playwright + axe)
        run: pnpm test:e2e
        env:
          BASE_URL: http://localhost:3000
          E2E_EDITOR_PASSWORD: e2e-test-only

      - name: Show container logs
        if: failure()
        run: docker logs app || true

      - name: Image tags
        id: meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=main

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilds from the cache filled above, so this pushes the image that was just tested.
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
