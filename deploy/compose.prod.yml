# Production stack on the Gliagora server (PLAN §11.2, §11.7.1).
# Lives in /opt/gliagora next to .env (see .env.example) and the Caddyfile; see README.md.
#
#   docker compose -f compose.prod.yml up -d --wait
#
# Only Caddy is reachable from the internet. The app and PostgreSQL are never published: ports
# published by Docker bypass the ufw firewall. listmonk's admin is published on the server's own
# loopback only (127.0.0.1), reached through an SSH tunnel (README.md, "listmonk").
name: gliagora

# Every container logs to the systemd journal, which keeps 14 days (D34; logs/90-gliagora.conf,
# installed by logs/install-journald.sh). Docker's default would rotate by size only, so on a quiet
# site its lines would outlive the 14 days the privacy texts give. `docker compose logs` reads the
# journal as before; `journalctl -t gliagora-app-1` does too.
x-logging: &logging
  driver: journald
  options:
    tag: '{{.Name}}'

services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./admin-auth.caddy:/etc/caddy/admin-auth.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
      # The map's basemap, filled by basemap/fetch-basemap.sh (not in backups; fetched again).
      - ./basemap/public:/srv/basemap:ro
    depends_on:
      app:
        condition: service_healthy
    logging: *logging
    security_opt:
      - no-new-privileges:true

  app:
    image: ${APP_IMAGE:-ghcr.io/ismailtufan123/gliagora:main}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://gliagora:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/gliagora
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in .env}
      # The site's address: only its own pages may use an editor's session cookie (Payload's CSRF
      # check), and Payload's emails (a password reset) link to it.
      SERVER_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      # Spam check of the public forms (ALTCHA, on this server only).
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:?Set ALTCHA_HMAC_KEY in .env}
      # Runs scheduled jobs: the nightly check for a new ROR release (PLAN §6.2), the hourly expiry
      # of listings, the retention purges (D34) and the automatic emails (src/jobs/maintenance/).
      PAYLOAD_JOBS_AUTORUN: 'true'
      # Optional; raises the ROR API rate limit for editors adding institutions by ROR ID.
      ROR_CLIENT_ID: ${ROR_CLIENT_ID:-}
      # Outgoing email through the Turkish mailbox's SMTP server (from M2, PLAN §11.7.1, D22).
      # Empty SMTP_HOST: nothing is sent.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Gliagora <hello@gliagora.com>}
      # The cap on the emails the public forms send in all (D49): empty, 50 an hour and 200 a day.
      # Set from the mailbox's sending limit at M2, leaving room for the scheduled emails and the
      # issues of Glia Notes (.env.example).
      EMAIL_CAP_HOUR: ${EMAIL_CAP_HOUR:-}
      EMAIL_CAP_DAY: ${EMAIL_CAP_DAY:-}
      # Member sign-in with Google and ORCID (M4b, D49): each is off until both of its keys are
      # set. ORCID_ISSUER stays ORCID's own; the app refuses ORCID's sandbox here. Email links
      # switch on with SMTP_HOST. Nothing else about sign-in reaches the app.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID:-}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET:-}
      ORCID_ISSUER: ${ORCID_ISSUER:-https://orcid.org}
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    # PostgreSQL 18, the same major version as local development and CI.
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    # Its log (in the journal, 14 days) keeps an error's message but not its DETAIL, which can quote
    # a value (a duplicate address, from listmonk or the app), nor the statement that failed: logs
    # hold no addresses (D34). The apps log their own failures by error class. CI and compose.yaml
    # start it the same way (src/lib/deploy-scripts.test.ts).
    command: [postgres, -c, log_error_verbosity=terse, -c, log_min_error_statement=panic]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Read once by postgres/init/10-app-database.sh when the data volume is created.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      # Read by postgres/init/20-listmonk-database.sh, on a new volume and on every update
      # (listmonk/prepare.sh), which sets listmonk's database password from it.
      LISTMONK_DB_PASSWORD: ${LISTMONK_DB_PASSWORD:?Set LISTMONK_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      # Over TCP: while the image sets up a new volume, its temporary server listens on the local
      # socket only, so a check there could pass before the real server is up and listmonk/
      # prepare.sh ran into the set-up (backup/restore.sh waits the same way).
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d gliagora']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 2s
    logging: *logging
    security_opt:
      - no-new-privileges:true

  # Glia Notes' newsletter service (M2, D50; README.md, "listmonk"): the latest stable release,
  # unmodified, with its own role and database in the PostgreSQL above. Only the app talks to it
  # (http://listmonk:9000 on this stack's network); nothing depends on it, so the app and its
  # deploys keep working while it is down. listmonk/prepare.sh (run by update.sh) installs it, never
  # this service, so no admin account is ever left for "the first visitor", and applies its
  # settings from the repository (listmonk/settings.sql). The start only applies a newer image's
  # database migrations, as upstream's compose file does (the update's backup comes first).
  listmonk:
    image: listmonk/listmonk:v6.2.0@sha256:f535d59e14991337a9f2d570273685378ae86b0d7698c3e00da444e3bc205286
    restart: unless-stopped
    command: [sh, -c, "./listmonk --upgrade --yes --config '' && exec ./listmonk --config ''"]
    environment:
      TZ: Etc/UTC
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: db
      LISTMONK_db__port: '5432'
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD:?Set LISTMONK_DB_PASSWORD in .env}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      # A small pool: the server is shared, and listmonk sends one issue a month.
      LISTMONK_db__max_open: '5'
      LISTMONK_db__max_idle: '5'
      LISTMONK_db__max_lifetime: 300s
    ports:
      # Its admin, on the server's loopback only: reached through an SSH tunnel (README.md).
      - '127.0.0.1:9000:9000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

# IPv6 on the stack's network: Docker then forwards IPv6 visitors to Caddy with ip6tables NAT,
# which keeps their address. Without it, docker-proxy forwards them from the bridge gateway (for
# example 172.18.0.1), so Caddy, its access log and the form rate limit (src/lib/forms/client-ip.ts)
# see one address for every IPv6 visitor. Docker Engine 27 and later (setup-server.sh) has ip6tables
# on by default and gives such a network a local (ULA) prefix of its own; it also works on a server
# without public IPv6. Check it after the first deploy (README.md, step 5). Only if the server's
# kernel has IPv6 switched off does Docker refuse to create this network ("Cannot read IPv6
# setup"): then remove these lines and publish no AAAA record.
networks:
  default:
    enable_ipv6: true

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
  db-data:
