# Checks every pull request and every push to main. On main, the Docker image is also pushed to
# GHCR (ghcr.io/<owner>/<repo>), where the server pulls it from (PLAN §11.5, §11.7.1).
# Third-party actions and images are pinned to exact versions (PLAN §18.2).
#
# Minutes (PLAN §11.5, D46): a private repository on GitHub Free has 2,000 Actions minutes a month,
# and when they run out, CI and every deploy stop. A pull request's full run costs about 20 of them
# (since M4b), so:
# - a change that touches only documentation runs no CI at all (`paths` below, the same list for
#   both events): Markdown files and docs/, except those the app or a test reads (content/, the
#   editor guide the admin shows, the Turkish strings table a unit test compares, and the
#   runbook, whose address-code command a unit test runs). Nothing waits
#   for the skipped run: the repository has no required checks, and only a CI run of a push to
#   main starts a deploy (deploy.yml), which a documentation change does not need;
# - a push to main whose tree a pull request's run has already passed (a squash merge of a branch
#   that is up to date with main) does not repeat the checks and tests: it only builds the image,
#   smoke-tests it and pushes it (job `tested`).
name: CI

on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'content/**'
      - 'docs/editor-guide-tr.md'
      - 'docs/tr-strings-review.md'
      - 'deploy/README.md'
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'content/**'
      - 'docs/editor-guide-tr.md'
      - 'docs/tr-strings-review.md'
      - 'deploy/README.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same PostgreSQL image as production (deploy/compose.prod.yml).
  POSTGRES_IMAGE: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722

jobs:
  # On a push to main: has a pull request's run already passed with exactly this tree? Each pull
  # request run that passes records the tree it tested (the merge of the branch into main) as an
  # artifact named tested-tree-<tree> (the last step of `image`). Squash-merging a branch that is up
  # to date with main gives main that same tree; then the checks and tests would only repeat, and
  # the run builds, smoke-tests and pushes the image only. When in doubt (no such artifact, a run
  # that did not pass, any error), `run` stays empty and everything runs.
  tested:
    name: Find a passed run of this tree
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Whatever happens here (an error, a stalled API call, a runner that does not start), the run
    # does not fail because of it: `run` stays empty and everything runs.
    continue-on-error: true
    permissions:
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - id: find
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TREE: ${{ github.event.head_commit.tree_id }}
        run: |
          run=''
          if [[ "$TREE" =~ ^[0-9a-f]{40}$ ]]; then
            ids=$(gh api "repos/$REPO/actions/artifacts?name=tested-tree-$TREE&per_page=30" \
              --jq '.artifacts[] | select(.expired | not) | .workflow_run.id') || ids=''
            for id in $ids; do
              # Only a pull request run of this workflow, in this repository, that passed.
              found=$(gh api "repos/$REPO/actions/runs/$id" --jq "select(.conclusion == \"success\"
                and .event == \"pull_request\" and .path == \".github/workflows/ci.yml\"
                and .head_repository.full_name == \"$REPO\") | .id") || found=''
              if [[ -n "$found" ]]; then run="$found"; break; fi
            done
          fi
          if [[ -n "$run" ]]; then
            echo "::notice title=Tests not repeated::Run $run passed with this tree ($TREE) in its pull request: building, smoke-testing and pushing the image only."
          else
            echo "No passed pull request run of tree $TREE: running every check and test."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  checks:
    name: Lint, typecheck, test
    needs: tested
    # Runs on pull requests (where `tested` is skipped) and on main unless the tree passed already.
    if: ${{ !cancelled() && needs.tested.outputs.run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # src/payload-types.ts must match the collections and globals: the types are checked against
      # it, and tests/e2e/access.spec.ts reads the collections and globals to test from it.
      - name: Generated Payload types are up to date
        run: pnpm generate:types && git diff --exit-code -- src/payload-types.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  image:
    name: Build, test and push image
    needs: [tested, checks]
    # After the checks passed, or without them when this tree passed in its pull request already.
    if: >-
      ${{ !cancelled() && (needs.checks.result == 'success' ||
      (needs.checks.result == 'skipped' && needs.tested.outputs.run != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: gliagora:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Throwaway secrets for the app, generated once and used by both runs of it below (the smoke
      # test and the end-to-end tests), so the session and the spam-check keys stay the same; and
      # the token of the app's API user in the end-to-end tests' listmonk (M2).
      - name: Generate the app's test secrets
        run: |
          for name in PAYLOAD_SECRET ALTCHA_HMAC_KEY LISTMONK_API_TOKEN; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "APP_$name=$value" >> "$GITHUB_ENV"
          done

      # Start the image against an empty PostgreSQL: migrations must apply at startup,
      # /health/ must report the database as reachable and the pages must render. Production-like:
      # no mail server and no test settings, so member sign-in is off (M4b).
      - name: Smoke test
        run: |
          set -euo pipefail
          docker network create smoke
          # Started as the server starts it (deploy/compose.prod.yml), and waited for over TCP.
          docker run -d --name db --network smoke -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=gliagora -e POSTGRES_PASSWORD=smoke-test-only -e POSTGRES_DB=gliagora \
            "$POSTGRES_IMAGE" postgres -c log_error_verbosity=terse -c log_min_error_statement=panic
          for i in $(seq 1 30); do docker exec db pg_isready -h 127.0.0.1 -U gliagora -d gliagora && break; sleep 2; done
          docker run -d --name app --network smoke -p 3000:3000 \
            -e DATABASE_URL=postgres://gliagora:smoke-test-only@db:5432/gliagora \
            -e PAYLOAD_SECRET="$APP_PAYLOAD_SECRET" \
            -e ALTCHA_HMAC_KEY="$APP_ALTCHA_HMAC_KEY" \
            gliagora:ci
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/health/ && break; sleep 2; done
          echo
          # Read the whole response before searching it: `curl | grep -q` fails under pipefail when
          # grep stops at the first match while curl is still writing a longer page (curl exit 23).
          contains() { local body; body="$(curl -fsS "$1")"; grep -qF -- "$2" <<<"$body"; }
          contains http://localhost:3000/health/ '"ok"'
          contains http://localhost:3000/en/ 'Where neuroscience meets'
          contains http://localhost:3000/en/contact/ 'hello@gliagora.com'
          # Member sign-in stays off without its settings, and the account page still answers.
          contains http://localhost:3000/en/sign-in/ 'Signing in is not available yet.'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/en/account/)" = 200
          # The data-requests page reads its text when it is requested (the image must hold the
          # file, next.config.ts), and its form waits for a mail server.
          dr="$(curl -fsS http://localhost:3000/en/legal/data-requests/)"
          grep -qF 'Your rights in short' <<<"$dr"
          grep -qF 'The form is temporarily unavailable.' <<<"$dr"
          # Nor are there Save buttons on the jobs list.
          jobs="$(curl -fsS http://localhost:3000/en/jobs/)"
          if grep -qF 'save-button' <<<"$jobs"; then echo 'Save buttons without sign-in'; exit 1; fi
          # The Glia Notes signup (M2) stays off without listmonk and a mail server.
          contains http://localhost:3000/en/newsletter/ 'Signing up for Glia Notes is not open yet.'
          logs="$(docker logs app 2>&1)"; grep -qF 'Member sign-in: email off, google off, orcid off' <<<"$logs"
          grep -qF 'Email cap of the forms: 50 an hour, 200 a day (default)' <<<"$logs"
          # The site's stage defaults to private: the full site, behind Caddy's password (D50).
          grep -qF 'Site stage: private' <<<"$logs"
          grep -qF 'Glia Notes: signup off (no listmonk settings), unsubscribe off' <<<"$logs"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = 308
          test "$(docker exec app id -u)" != 0
          docker exec db psql -U gliagora -d gliagora -tAc 'select name from payload_migrations'
          echo "Smoke test passed"

      # PLAN §17.2: axe, keyboard paths and HTTP behaviour against the image that was just built.
      # Each of the steps up to the end-to-end tests is left out on a push to main whose tree
      # passed them in its pull request (job `tested`).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.tested.outputs.run == ''
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.tested.outputs.run == ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: needs.tested.outputs.run == ''
        run: pnpm install --frozen-lockfile
      # Institutions for the institution pages: 21 records from a ROR release (CC0), imported with
      # the same code as the nightly import. The taxonomy and countries come with the migrations.
      # Then fake jobs at those institutions, including the fixed ones the jobs tests rely on
      # (src/scripts/fake-jobs-fixed.ts), and the editor account the admin API tests sign in with
      # (src/scripts/e2e-editor.ts; an example.org address, in this throwaway database only), and
      # the test members with their known sessions (src/scripts/e2e-member.ts, M4b).
      - name: Load test data
        if: needs.tested.outputs.run == ''
        run: |
          pnpm ror:import tests/fixtures/ror/v2.13-2026-09-22-ror-data-sample.zip
          pnpm fake:jobs
          pnpm e2e:editor
          pnpm e2e:member
        env:
          DATABASE_URL: postgres://gliagora:smoke-test-only@localhost:5432/gliagora
          PAYLOAD_SECRET: test-data-only
          E2E_EDITOR_PASSWORD: e2e-test-only
          E2E_MEMBER_TOKEN: e2e-test-only
      # The end-to-end tests need what the smoke test leaves out (M4b): a mail server, for the
      # emails the tests read back (Mailpit, the image compose.yaml pins, only on this machine's
      # loopback), and the fake Google and ORCID (tests/fake-oidc/server.ts, which Playwright
      # starts on this machine at 127.0.0.1:9400 for the end-to-end step). So the app is made again
      # with SMTP_HOST and AUTH_TEST_ISSUER, on the host's network: the app, the browser, Mailpit
      # and the fake providers then meet on 127.0.0.1, so the mail server is local to the app (no
      # TLS needed), the app and the browser use one issuer address, and the app's own address is
      # the browser's http://localhost:3000. The same secrets as the smoke test. This also starts
      # the app afresh, which the home page's figures need: it keeps them for up to 10 minutes
      # (src/lib/home.ts), and the smoke test read them from the empty database.
      #
      # listmonk (M2, D50) is set up with the steps of deploy/listmonk/prepare.sh, repeated here
      # with Docker (not the script itself, which src/lib/deploy-scripts.test.ts runs whole against
      # a stand-in for docker), with the image compose.yaml pins (the server's): its role and
      # database made by the server's own script in the running database, the install as a one-off
      # with its admin's password on stdin (the same command as prepare.sh's), the settings as
      # prepare.sh's own psql input (the API user with the run's token, the mail server Mailpit),
      # then the service with the server's hardening, on this machine's loopback. The app gets its
      # address and token (the Glia Notes signup and unsubscribe, whose start line must say they
      # are on), and a higher cap on the forms' emails than the default 50 an hour, which a whole
      # run of the end-to-end tests would come close to.
      - name: Re-create the app with the test settings
        if: needs.tested.outputs.run == ''
        run: |
          set -euo pipefail
          export LISTMONK_API_TOKEN="$APP_LISTMONK_API_TOKEN"
          mailpit_image=$(grep -oE 'axllent/mailpit[^[:space:]]+' compose.yaml | head -n 1)
          test -n "$mailpit_image"
          docker run -d --name mailpit -p 127.0.0.1:1025:1025 -p 127.0.0.1:8025:8025 \
            -e MP_DISABLE_VERSION_CHECK=true "$mailpit_image"
          listmonk_image=$(grep -oE 'listmonk/listmonk[^[:space:]]+' compose.yaml | head -n 1)
          test -n "$listmonk_image"
          docker cp deploy/postgres/init/20-listmonk-database.sh db:/tmp/20-listmonk-database.sh
          docker exec -e LISTMONK_DB_PASSWORD=listmonk-ci-only db bash /tmp/20-listmonk-database.sh
          listmonk=(--network host --security-opt no-new-privileges:true --cap-drop ALL
            -e TZ=Etc/UTC -e LISTMONK_app__address=127.0.0.1:9000 -e LISTMONK_db__host=127.0.0.1
            -e LISTMONK_db__port=5432 -e LISTMONK_db__user=listmonk
            -e LISTMONK_db__password=listmonk-ci-only -e LISTMONK_db__database=listmonk
            -e LISTMONK_db__ssl_mode=disable)
          # shellcheck disable=SC2016
          openssl rand -hex 16 | docker run --rm -i "${listmonk[@]}" "$listmonk_image" sh -c '
            IFS= read -r LISTMONK_ADMIN_PASSWORD &&
            export LISTMONK_ADMIN_PASSWORD LISTMONK_ADMIN_USER=gliagora-admin &&
            exec ./listmonk --install --idempotent --yes --config ""'
          LISTMONK_ROOT_URL=http://127.0.0.1:9000 SMTP_HOST=127.0.0.1 SMTP_PORT=1025 \
            bash -c 'source deploy/listmonk/prepare.sh && settings_input' \
            | docker exec -i db psql -U gliagora -d listmonk -X -q -tA -v ON_ERROR_STOP=1
          docker run -d --name listmonk "${listmonk[@]}" "$listmonk_image" \
            sh -c "./listmonk --upgrade --yes --config '' && exec ./listmonk --config ''"
          docker rm -f app
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://gliagora:smoke-test-only@127.0.0.1:5432/gliagora \
            -e PAYLOAD_SECRET="$APP_PAYLOAD_SECRET" \
            -e ALTCHA_HMAC_KEY="$APP_ALTCHA_HMAC_KEY" \
            -e SMTP_HOST=127.0.0.1 -e SMTP_PORT=1025 \
            -e AUTH_TEST_ISSUER=http://127.0.0.1:9400 \
            -e LISTMONK_URL=http://127.0.0.1:9000 -e LISTMONK_API_TOKEN \
            -e EMAIL_CAP_HOUR=1000 -e EMAIL_CAP_DAY=5000 \
            gliagora:ci
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/health/ && break; sleep 2; done
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8025/readyz && break; sleep 1; done
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/health && break; sleep 1; done
          echo
          # The server's health check works under its hardening, and the app's API user sees
          # Glia Notes and nothing of listmonk's settings.
          docker exec listmonk wget -q -O /dev/null http://127.0.0.1:9000/health
          auth() { printf 'Authorization: token gliagora-app:%s\n' "$LISTMONK_API_TOKEN"; }
          lists="$(curl -fsS -H @<(auth) http://127.0.0.1:9000/api/lists)"
          grep -qF '"name":"Glia Notes"' <<<"$lists"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H @<(auth) http://127.0.0.1:9000/api/settings)" = 403
          logs="$(docker logs app 2>&1)"; grep -qF 'Member sign-in: email on, google on, orcid on' <<<"$logs"
          grep -qF 'Email cap of the forms: 1000 an hour, 5000 a day' <<<"$logs"
          grep -qF 'Glia Notes: signup on, unsubscribe on' <<<"$logs"
      # The M2 state (D41, D50), switched on in a second container of the same image beside the app
      # under test: SITE_STAGE=m2 on port 3001, production-like (no test sign-in providers), with
      # the app's mail server, listmonk and cap on the forms' emails (they share the database), so
      # that Glia Notes can be signed up for through Caddy once its text is approved. The end-to-end
      # step puts Caddy, the production Caddyfile, in front of each (tests/caddy/serve.ts): the M2
      # state's public pages open without the password and everything else asks for it, and the
      # private stage asks for it everywhere but /health/ (tests/e2e/m2.spec.ts, project m2); a
      # third Caddy opens every text in front of the M2 app, which answers a plain 404 for those it
      # holds as drafts, and a fourth like it serves the tests of the rate limits
      # (tests/e2e/rate-limits.spec.ts, D42). Caddy is the binary of the image compose.prod.yml
      # pins, the server's own build with the rate-limit module (deploy/caddy-image, in GHCR),
      # copied out of it.
      # Also checks that the production Compose file is well-formed, with the placeholders of its
      # .env.example.
      - name: Start the M2 state beside it
        if: needs.tested.outputs.run == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker run -d --name app-m2 --network host --no-healthcheck \
            -e PORT=3001 -e SITE_STAGE=m2 \
            -e DATABASE_URL=postgres://gliagora:smoke-test-only@127.0.0.1:5432/gliagora \
            -e PAYLOAD_SECRET="$APP_PAYLOAD_SECRET" \
            -e ALTCHA_HMAC_KEY="$APP_ALTCHA_HMAC_KEY" \
            -e SMTP_HOST=127.0.0.1 -e SMTP_PORT=1025 \
            -e LISTMONK_URL=http://127.0.0.1:9000 -e LISTMONK_API_TOKEN="$APP_LISTMONK_API_TOKEN" \
            -e EMAIL_CAP_HOUR=1000 -e EMAIL_CAP_DAY=5000 \
            gliagora:ci
          caddy_image=$(grep -oE 'ghcr\.io/[^[:space:]]+-caddy:[^[:space:]]+' deploy/compose.prod.yml | head -n 1)
          test -n "$caddy_image"
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          id=$(docker create "$caddy_image")
          docker cp "$id:/usr/bin/caddy" "$RUNNER_TEMP/caddy"
          docker rm "$id" > /dev/null
          docker logout ghcr.io
          "$RUNNER_TEMP/caddy" version
          "$RUNNER_TEMP/caddy" list-modules | grep -qx http.handlers.rate_limit
          docker compose --env-file deploy/.env.example -f deploy/compose.prod.yml config --quiet
          for i in $(seq 1 60); do curl -fsS http://localhost:3001/health/ && break; sleep 2; done
          echo
          logs="$(docker logs app-m2 2>&1)"; grep -qF 'Site stage: m2' <<<"$logs"
          grep -qF 'Glia Notes: signup on, unsubscribe on' <<<"$logs"
      # Tests against a real PostgreSQL (pnpm test:db), on scratch databases dropped afterwards:
      # search (src/lib/search/search.db.test.ts, owned by a throwaway role that is not a superuser,
      # as on the server) and the scheduled tasks (tests/integration/, M4.7, on a migrated scratch
      # database, with a throwaway Mailpit container for the emails), and listmonk with the
      # server's settings (tests/integration/listmonk.db.test.ts, a throwaway container of the
      # image above on a scratch database of its own, M2).
      - name: Database tests
        if: needs.tested.outputs.run == ''
        run: pnpm test:db
        env:
          TEST_DATABASE_URL: postgres://gliagora:smoke-test-only@localhost:5432/gliagora
          PAYLOAD_SECRET: test-data-only
      - name: Install Chromium for Playwright
        if: needs.tested.outputs.run == ''
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests (Playwright + axe)
        if: needs.tested.outputs.run == ''
        run: pnpm test:e2e
        env:
          BASE_URL: http://localhost:3000
          E2E_EDITOR_PASSWORD: e2e-test-only
          E2E_MEMBER_TOKEN: e2e-test-only
          MAILPIT_URL: http://127.0.0.1:8025
          AUTH_TEST_ISSUER: http://127.0.0.1:9400
          # The M2 state through Caddy (the step above; Playwright starts the two Caddies).
          CADDY_BIN: ${{ runner.temp }}/caddy
          M2_APP_URL: http://127.0.0.1:3001
          # The tests read what listmonk holds after a signup or an unsubscribe (Glia Notes, M2).
          LISTMONK_URL: http://127.0.0.1:9000
          LISTMONK_API_TOKEN: ${{ env.APP_LISTMONK_API_TOKEN }}

      # Records that this tree passed every check and test, for the push to main that merges it
      # (job `tested`). Only a pull request run that got this far uploads it. A failure here only
      # means that main runs the tests again, so it never turns the run red.
      - name: Record the tested tree
        id: tree
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git rev-parse 'HEAD^{tree}' > tested-tree.txt
          echo "tree=$(cat tested-tree.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload the tested tree
        if: github.event_name == 'pull_request' && steps.tree.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree.txt
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Show container logs
        if: failure()
        run: |
          docker logs app || true
          docker logs app-m2 || true
          docker logs mailpit || true
          docker logs listmonk || true

      - name: Image tags
        id: meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=main

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilds from the cache filled above, so this pushes the image that was just tested (or, when
      # its tree passed in the pull request, the image that was just built and smoke-tested).
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
