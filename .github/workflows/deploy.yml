# Deploys an image from GHCR to the production server (PLAN §11.5, D27, D43).
#
# Three ways in, all switched off unless the repository variable DEPLOY_ENABLED is `true`:
# - by hand: Actions → Deploy → Run workflow on `main`, with an image tag (`main` or `sha-` plus
#   the first 7 characters of a commit); also the way to roll back on purpose;
# - automatically after every green CI run of a push to `main`, deploying that commit's image,
#   while the repository variable DEPLOY_AUTO is `main` (while the site is private, until M2);
# - automatically for a pushed release tag `v…` on a commit whose CI run on `main` passed, while
#   DEPLOY_AUTO is `tags` (from M2 on). Any other value of DEPLOY_AUTO: by hand only.
# A push to main that changes only documentation runs no CI (ci.yml, `paths`), so it builds no
# image and deploys nothing; the server keeps the image of the last commit whose CI passed. A
# release tag on such a commit deploys that image.
# Setup: deploy/README.md, "How deploys work" and "4. Connect GitHub (once)".
#
# No long-lived registry credentials: the job's own GITHUB_TOKEN (valid only while the job runs)
# is sent over SSH to deploy/deploy-remote.sh, which pulls with it and discards it.
#
# The DEPLOY_* values are repository secrets: GitHub Free has no environments for a private
# repository (D42), so a workflow on any branch of this repository could read them. What they
# unlock is small: the key logs in as the user `deploy`, which may run only deploy-remote.sh, which
# only deploys a `main` or `sha-` image from this repository's GHCR package. Whoever can push to
# the repository could still deploy an image of their own, so only the operator has write access.
# The server's host key is pinned in DEPLOY_KNOWN_HOSTS.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy (main or sha-<first 7 characters of the commit>)
        required: true
        default: main
  # Runs from the default branch's copy of this file whenever CI finishes; the check job decides.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Check that this deploy may run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          DEPLOY_AUTO: ${{ vars.DEPLOY_AUTO }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          skip() {
            echo "::notice title=Deploy skipped::$1 Nothing was deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          fail() {
            echo "::error title=Not deployed::$1 Nothing was deployed."
            exit 1
          }
          # The CI runs of a push to main for one commit that passed (0 if none).
          passed() {
            gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$1&event=push&branch=main&status=success" --jq '.total_count'
          }
          # A file whose change runs no CI (ci.yml, `paths`, D46): Markdown files and docs/, except
          # those the app or a test reads. Keep this in step with both `paths` lists in ci.yml
          # (src/lib/ci-paths.test.ts checks it).
          documentation_only() {
            case "$1" in
              content/* | docs/editor-guide-tr.md | docs/tr-strings-review.md | deploy/README.md) return 1 ;;
              *.md | docs/*) return 0 ;;
              *) return 1 ;;
            esac
          }
          if [[ "$DEPLOY_ENABLED" != true ]]; then
            skip "Deploys are not enabled (repository variable DEPLOY_ENABLED is not true)."
          fi
          case "$EVENT" in
            workflow_dispatch)
              tag="$INPUT_TAG"
              if [[ "$REF" != refs/heads/main ]]; then
                echo "::error title=Wrong branch::Run the Deploy workflow from main."
                exit 1
              fi
              ;;
            workflow_run)
              [[ "$DEPLOY_AUTO" == main ]] || skip "Automatic deploys after CI are off (DEPLOY_AUTO is not main)."
              # Only a green run of a push to main in this repository, never a pull request's run.
              if [[ "$RUN_CONCLUSION" != success || "$RUN_EVENT" != push || "$RUN_BRANCH" != main || "$RUN_REPO" != "$REPO" ]]; then
                skip "CI run: $RUN_CONCLUSION, $RUN_EVENT on $RUN_BRANCH of $RUN_REPO; only a green push to main deploys."
              fi
              # A re-run of an older commit's run must not replace a newer deploy: only the newest
              # commit of main whose CI passed is deployed.
              newest=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha')
              [[ "$newest" == "$RUN_SHA" ]] || skip "CI of a newer commit of main (${newest:0:7}) has passed since ${RUN_SHA:0:7}; that one is deployed."
              tag="sha-${RUN_SHA:0:7}"
              ;;
            push)
              [[ "$DEPLOY_AUTO" == tags ]] || skip "Release-tag deploys are off (DEPLOY_AUTO is not tags)."
              # The tag must name a commit of main. Its image is the one CI built and tested for it.
              # A commit that changed only documentation has no CI run and no image (ci.yml,
              # `paths`, D46): then the image of the newest commit before it whose CI passed, if
              # every change since is documentation too. Anything else fails, so that a release
              # tag that deploys nothing shows red.
              on_main=$(gh api "repos/$REPO/compare/$SHA...main" --jq '.status')
              [[ "$on_main" == behind || "$on_main" == identical ]] || fail "${SHA:0:7} is not a commit of main."
              build="$SHA"
              if [[ "$(passed "$SHA")" -eq 0 ]]; then
                ran=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main" --jq '.total_count')
                [[ "$ran" -eq 0 ]] || fail "CI of ${SHA:0:7} on main has not passed (it is still running, or it failed); tag a commit after its CI has passed."
                build=''
                for commit in $(gh api "repos/$REPO/commits?sha=$SHA&per_page=30" --jq '.[1:][].sha'); do
                  if [[ "$(passed "$commit")" -gt 0 ]]; then build="$commit"; break; fi
                done
                [[ -n "$build" ]] || fail "None of the 30 commits before ${SHA:0:7} has a CI run on main that passed."
                while IFS= read -r file; do
                  documentation_only "$file" || fail "${SHA:0:7} has no CI run, but $file changed since ${build:0:7}, the last commit whose CI passed."
                done < <(gh api "repos/$REPO/compare/$build...$SHA" --jq '.files[].filename')
                echo "::notice title=Image of an earlier commit::${SHA:0:7} changed only documentation since ${build:0:7}, so the image of ${build:0:7} is deployed."
              fi
              tag="sha-${build:0:7}"
              ;;
            *)
              echo "::error title=Unexpected event::$EVENT"
              exit 1
              ;;
          esac
          if [[ ! "$tag" =~ ^(main|sha-[0-9a-f]{7})$ ]]; then
            echo "::error title=Invalid tag::Use main or sha- plus the first 7 characters of a commit."
            exit 1
          fi
          echo "Deploying $tag ($EVENT)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ needs.check.outputs.tag }}
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # One deploy at a time. A newer deploy that is waiting replaces an older one that is still
    # waiting, so after several quick merges only the newest image is deployed. On this job, not the
    # workflow, so runs that only skip never take a waiting deploy's place.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      packages: read
    steps:
      - name: Deploy over SSH
        env:
          TAG: ${{ needs.check.outputs.tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error title=Deploy misconfigured::Missing repository secrets: ${missing[*]}. Nothing was deployed."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's host key, checked strictly: no trust on first use.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n%s\n' "$GITHUB_ACTOR" "$REGISTRY_TOKEN" \
            | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                "$DEPLOY_USER@$DEPLOY_HOST" "deploy $TAG"

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
