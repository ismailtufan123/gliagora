# Managed by deploy/logs/install-journald.sh (Gliagora, D34): installed as
# /etc/systemd/journald.conf.d/zz-gliagora.conf.
#
# The name matters: journald reads every drop-in, of /usr/lib and /etc alike, in the order of their
# file names, and the last one wins. Ubuntu ships /usr/lib/systemd/journald.conf.d/syslog.conf with
# ForwardToSyslog=yes; a name that sorts before it (this file's first one, 90-gliagora.conf) left
# that setting in force, found on the server on 2026-10-05. So this file sorts last, and the
# installer checks the settings that are in force.
#
# The journal holds the containers' logs (compose.prod.yml logs them here) and the server's own
# (sudo, SSH, the backup units). The privacy texts give 14 days for server logs (PLAN §18.1), so:
[Journal]
# Lines older than 14 days are deleted. journald deletes whole files, and starts a new one each
# day, so a line lives 14 to 15 days, as in Caddy's daily access logs.
MaxRetentionSec=14day
MaxFileSec=1day
# At most 1 GB, so the journal never takes the room the map's basemap needs (README.md, step 8).
SystemMaxUse=1G
# No copy in /var/log/syslog, which logrotate keeps for weeks. fail2ban reads the journal itself.
ForwardToSyslog=no
